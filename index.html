<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
.main-title {
    font-size: 48px;
    margin-bottom: 10px;
    font-family: 'Dancing Script', cursive;
    background: linear-gradient(45deg, #ff8fb1, #ff4e73);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 5px 20px rgba(255, 78, 115, 0.4);
}
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #2b1055, #0f0c29);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    overflow-x: hidden;
}

.container {
    position: relative;
display: flex;
    flex-direction: column;
    align-items: center;
}

.gift {
    position: relative;
    width: 160px;
    height: 140px;
    cursor: pointer;
    transition: opacity 0.6s ease, transform 0.6s ease;
    margin: auto;
}

.box {
    width: 160px;
    height: 110px;
    background: linear-gradient(145deg, #ff4e73, #ff2e63);
    border-radius: 12px;
    position: absolute;
    bottom: 0;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}

.lid {
    width: 170px;
    height: 40px;
    background: linear-gradient(145deg, #ff7b93, #ff4e73);
    border-radius: 12px;
    position: absolute;
    top: 0;
    left: -5px;
    transition: transform 0.6s ease;
}

/* Ribbon */
.box::before,
.lid::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 100%;
    background: white;
    left: 50%;
    transform: translateX(-50%);
}

.gift.open {
    opacity: 0;
    transform: scale(0.8);
}

.gift.open .lid {
    transform: translateY(-60px) rotate(-10deg);
}

.message {
    font-family: 'Dancing Script', cursive;
    font-size: 26px;
    width: 340px;
    margin-top: 25px;
    min-height: 100px;
    line-height: 1.5;
    letter-spacing: 1px;
    text align: centre;
}
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: #ff4d6d;
    color: white;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">
    <div class="gift" id="gift">
        <div class="lid"></div>
        <div class="box"></div>
    </div>
<h1 class="main-title">Happy Birthday Gunkirti 🎉</h1>
<div id="message" class="message"></div>
   </div>

<audio id="bgMusic" src="song.mp3"></audio>

<script>
const gift = document.getElementById("gift");
const message = document.getElementById("message");
const music = document.getElementById("bgMusic");

const text = "Happy Birthday to the one person who has seen me at my worst and still chose to stay🥰. You’ve handled my moods, my ghosting phases, my unread messages, and my missed calls — and somehow never made me feel guilty for being me🫶.\n\nI honestly don’t say this enough, but I’m so grateful you’re in my life😭💕. Your sarcasm, your patience, your constant presence — it all means more than you know🤞.\n\nI’m damn sure no matter how dramatic I get, you’re not going anywhere… and that’s my favorite part about us🤗.\n\nStay the same. Stay annoying. Stay mine (in a best-friend way). 🤍";
gift.addEventListener("click", () => {
    gift.classList.add("open");
    startConfetti();
    typeWriter();
    music.play();
});

function typeWriter() {
    let i = 0;
    function typing() {
        if (i < text.length) {
            message.innerHTML += text.charAt(i) === "\n" ? "<br>" : text.charAt(i);
            i++;
            setTimeout(typing, 60);
        }
    }
    typing();
}

/* Confetti */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function startConfetti() {
    for (let i = 0; i < 150; i++) {
        confetti.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            r: Math.random() * 6 + 2,
            d: Math.random() * 100,
            color: `hsl(${Math.random() * 40 + 330}, 70%, 70%)`
        });
    }
    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confetti.forEach((c) => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.fill();
    });
    update();
    requestAnimationFrame(draw);
}

function update() {
    confetti.forEach((c) => {
        c.y += Math.cos(c.d) + 3;
        if (c.y > canvas.height) c.y = -10;
    });
}
</script>

</body>
</html>
