<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎉</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e1e2f, #2b2b45);
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
        color: white;
        text-align: center;
    }

    .container {
        position: relative;
    }

    .gift-box {
        width: 150px;
        height: 150px;
        background: #ff4d6d;
        position: relative;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.6s ease;
        margin: auto;
    }

    .gift-box::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 20px;
        background: #ff8fa3;
        top: -20px;
        border-radius: 10px 10px 0 0;
    }

    .gift-box::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 100%;
        background: #ff8fa3;
        left: 50%;
        transform: translateX(-50%);
    }

    .gift-box.open {
        transform: scale(0);
    }

    .message {
        font-size: 24px;
        width: 300px;
        margin-top: 20px;
        min-height: 80px;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        background: #ff4d6d;
        color: white;
        border-radius: 20px;
        cursor: pointer;
    }
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">
    <div id="gift" class="gift-box"></div>
    <div id="message" class="message"></div>
    <button id="musicBtn" style="display:none;">Play Music 🎵</button>
</div>

<audio id="bgMusic" src="song.mp3"></audio>
<script>
const gift = document.getElementById("gift");
const message = document.getElementById("message");
const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

const text ="Happy Birthday to the one person who has seen me at my worst and still chose to stay.💕 You’ve handled my moods, my ghosting phases, my unread messages, and my missed calls — and somehow never made me feel guilty for being me.🤗\n\nI honestly don’t say this enough, but I’m so grateful you’re in my life. ❤️Your sarcasm, your patience, your constant presence — it all means more than you know.🫶\n\nI’m damn sure no matter how dramatic I get, you’re not going anywhere… and that’s my favorite part about us.🥰\n\nStay the same. Stay annoying. Stay mine (in a best-friend way). 🤍";gift.addEventListener("click", () => {
    gift.classList.add("open");
    startConfetti();
    typeWriter();
    musicBtn.style.display = "inline-block";
});

musicBtn.addEventListener("click", () => {
    music.play();
    musicBtn.style.display = "none";
});

function typeWriter() {
    let i = 0;
    function typing() {
        if (i < text.length) {
            message.innerHTML += text.charAt(i) === "\n" ? "<br>" : text.charAt(i);
            i++;
            setTimeout(typing, 70);
        }
    }
    typing();
}

/* Confetti */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function startConfetti() {
    for (let i = 0; i < 150; i++) {
        confetti.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            r: Math.random() * 6 + 2,
            d: Math.random() * 100,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`
        });
    }
    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confetti.forEach((c, i) => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2, false);
        ctx.fillStyle = c.color;
        ctx.fill();
    });
    update();
    requestAnimationFrame(draw);
}

function update() {
    confetti.forEach((c) => {
        c.y += Math.cos(c.d) + 3;
        if (c.y > canvas.height) {
            c.y = -10;
        }
    });
}
</script>

</body>
</html>
